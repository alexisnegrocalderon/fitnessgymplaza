name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-and-test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm@10.4.1 fijado por "packageManager" en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm check

      - name: Tests (vitest)
        run: pnpm test
